name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install 'pytest>=8,<10'
      - run: python -m pytest tests -q
      - run: python tools/generate_branding.py && python -m pytest tests/test_regram_integration.py -q
      - run: test -z "$(git status --porcelain -- TMessagesProj/src/branding/res)"
