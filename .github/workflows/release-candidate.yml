# Manual, private release candidate. This does NOT publish to users: a real-device
# sign-off and an approved update channel are required before distribution.
name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      abi:
        description: Native ABI
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - x86_64
          - universal

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  candidate:
    # Protect the "release" environment with required reviewers in repository settings.
    environment: release
    # Full dex needs a 10 GiB Gradle heap; hosted 7 GiB runners are insufficient.
    runs-on: [self-hosted, linux, x64, regram-android]
    timeout-minutes: 120
    env:
      NATIVE_TARGET: ${{ inputs.abi }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.31.6'
      - name: Restore pinned native sources
        run: ./tools/restore_submodules.sh .
      - name: Install signing and Firebase files (private)
        env:
          FIREBASE_B64: ${{ secrets.REGRAM_GOOGLE_SERVICES_B64 }}
          KEYSTORE_B64: ${{ secrets.REGRAM_KEYSTORE_B64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name, dest in (("FIREBASE_B64", "TMessagesProj/google-services.json"),
                             ("KEYSTORE_B64", "TMessagesProj/release.keystore")):
              raw = os.environ.get(name)
              if not raw:
                  raise SystemExit(f"Missing secret {name}")
              path = Path(dest)
              path.write_bytes(base64.b64decode(raw, validate=True))
              path.chmod(0o600)
          PY
      - name: Preflight (no secrets printed)
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES_B64 }}
          CHAQUOPY_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: python3 tools/check_build_env.py --release
      - name: Build signed release candidate
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES_B64 }}
          CHAQUOPY_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx10g :TMessagesProj:assembleRelease
      - name: Verify package, native libraries and signature
        run: |
          python3 tools/verify_release_apk.py --abi "$NATIVE_TARGET" TMessagesProj/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: regram-candidate-${{ inputs.abi }}
          path: TMessagesProj/build/outputs/apk/release/*.apk
          retention-days: 1
          if-no-files-found: error
      - name: Remove secret files
        if: always()
        run: rm -f TMessagesProj/google-services.json TMessagesProj/release.keystore
